name: Monitor circolari scuola

# Niente schedule: da qui il controllo non puo' funzionare. Spaggiari
# risponde 403 alle richieste dei runner GitHub (rifiuta le reti dei
# datacenter), mentre dalla rete di casa risponde 200. Il controllo vero
# gira sul Mac di Luca; qui restano solo le due prove Telegram, che
# leggono dall'archivio e non toccano il sito della scuola.
on:
  workflow_dispatch:
    inputs:
      azione:
        description: 'Cosa deve fare questa esecuzione'
        type: choice
        default: prova-circolare
        options:
          - prova-circolare    # manda una circolare di prova ai destinatari
          - prova-riepilogo    # manda il riepilogo del lunedi' a chi lo riceve

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prova di invio su Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_HEARTBEAT_ID: ${{ secrets.TELEGRAM_HEARTBEAT_ID }}
        run: >-
          python3 circolari/_src/check.py
          ${{ inputs.azione == 'prova-circolare' && '--test'
          || inputs.azione == 'prova-riepilogo' && '--heartbeat' || '' }}
