name: Monitor circolari scuola

on:
  schedule:
    # orari UTC -> 9:00 11:00 13:00 16:00 18:00 ora italiana (ora legale).
    # In inverno l'Italia passa a UTC+1 e i controlli slittano un'ora indietro.
    - cron: '0 7,9,11,14,16 * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Manda una notifica di prova invece del controllo normale'
        type: boolean
        default: false

# Evita che due run sovrapposti si contendano il commit.
concurrency:
  group: circolari
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla le nuove circolari
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 circolari/_src/check.py ${{ inputs.prova && '--test' || '' }}

      - name: Salva archivio e pagina aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circolari/
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "circolari: aggiornamento automatico"
            git push
          fi
